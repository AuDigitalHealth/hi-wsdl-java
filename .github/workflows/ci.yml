name: CI

on:
  push:
    branches: [ java-21 ]
  pull_request:
    branches: [ java-21 ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify
        run: mvn -B "-Dgpg.skip=true" clean verify
